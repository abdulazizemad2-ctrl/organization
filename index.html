<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>بنك أسئلة المنظمات الدولية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap">
<style>
/* Layout: one centred working column; a setup panel that turns into an exam sheet, then a results ledger. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16231F; --muted:#5B6B66; --line:#D9E1DE;
  --accent:#1F6B57; --accent-ink:#FFFFFF; --accent-soft:#E2F0EB;
  --gold:#B07A1C; --gold-soft:#FBF0DA;
  --good:#1E7A47; --good-soft:#E3F3E9; --bad:#B4322A; --bad-soft:#FBE6E4;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#17211E; --ink:#E6EEEB; --muted:#9AABA5; --line:#2A3833;
  --accent:#4FB394; --accent-ink:#0B1411; --accent-soft:#1B3029;
  --gold:#E2B160; --gold-soft:#33291A;
  --good:#5CC48A; --good-soft:#16301F; --bad:#EE7A70; --bad-soft:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#17211E; --ink:#E6EEEB; --muted:#9AABA5; --line:#2A3833;
  --accent:#4FB394; --accent-ink:#0B1411; --accent-soft:#1B3029;
  --gold:#E2B160; --gold-soft:#33291A;
  --good:#5CC48A; --good-soft:#16301F; --bad:#EE7A70; --bad-soft:#3A1E1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.5}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
.top .eyebrow{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.02em}
.top h1{font-size:clamp(22px,5vw,30px);font-weight:800}
.top .code{font-family:var(--f-body);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 12px;white-space:nowrap}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.field{display:flex;flex-direction:column;gap:10px}
.field + .field{margin-top:22px;padding-top:20px;border-top:1px dashed var(--line)}
.label{font-weight:700;font-size:15px}
.hint{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg input,.chips input{position:absolute;opacity:0;pointer-events:none}
.seg label{position:relative;border:1.5px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;font-weight:600;font-size:14px;line-height:1.5;background:var(--surface)}
.seg label small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;cursor:pointer;background:var(--surface)}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.countrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.countrow input[type=range]{flex:1;min-width:180px;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:transparent;color:var(--ink);width:38px;height:40px;font-size:20px}
.stepper input{width:64px;text-align:center;border:0;border-inline:1.5px solid var(--line);height:40px;font:inherit;font-weight:700;background:var(--surface);color:var(--ink)}
.avail{font-size:13px;color:var(--muted)}
.avail b{color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 22px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.stat b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.3}
.stat span{font-size:12px;color:var(--muted)}

/* exam */
.bar{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.q{display:flex;flex-direction:column;gap:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:6px;padding:1px 9px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.src{background:var(--gold-soft);color:var(--gold)}
.tag.kind{background:transparent;border:1px solid var(--line);color:var(--muted)}
.qtext{font-size:19px;font-weight:700;line-height:1.8}
.qno{color:var(--accent);margin-inline-end:6px}
.opts{display:flex;flex-direction:column;gap:9px;list-style:none;padding:0;margin:0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--surface);color:var(--ink);line-height:1.7}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .k{border-color:var(--good);background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.why{border-inline-start:3px solid var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15px}
.why b{color:var(--gold)}
textarea{width:100%;min-height:140px;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}
.model{border:1.5px solid var(--accent);border-radius:10px;padding:14px 16px;background:var(--accent-soft);white-space:pre-line;font-size:15.5px}
.model h3{font-size:15px;color:var(--accent);margin-bottom:6px}
.self{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.self button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:600}
.self button[aria-pressed="true"].g{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.self button[aria-pressed="true"].m{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.self button[aria-pressed="true"].b{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots button{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;padding:0}
.dots button.cur{border-color:var(--ink);color:var(--ink)}
.dots button.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dots button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dots button.es{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}

/* results */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring div{width:94px;height:94px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-weight:800}
.score p{margin:0}
.review{display:flex;flex-direction:column;gap:12px}
.rv{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.rv .h{font-weight:700}
.rv .a{font-size:14.5px}
.rv .a.g{color:var(--good)} .rv .a.b{color:var(--bad)}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
@media (max-width:560px){.seg{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.qtext{font-size:17.5px}.panel{padding:16px}}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>

</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <div>
      <div class="eyebrow">مقرر المنظمات الدولية</div>
      <h1>بنك أسئلة المنظمات الدولية</h1>
    </div>
    <span class="code">LAW 355</span>
  </header>

  <!-- SETUP -->
  <section id="setup" class="panel" aria-labelledby="setupTitle">
    <h2 id="setupTitle" style="font-size:19px;margin-bottom:14px">جهّز اختبارك</h2>
    <div class="stats" id="stats"></div>
    <div class="field" style="margin-top:20px">
      <span class="label">نوع الأسئلة</span>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="kind" id="k-mcq" value="mcq" checked>اختياري<small>اختيار من متعدد</small></label>
        <label><input type="radio" name="kind" id="k-essay" value="essay">مقالي<small>مع إجابة نموذجية</small></label>
        <label><input type="radio" name="kind" id="k-mix" value="mix">مختلط<small>مثل الاختبار الفعلي</small></label>
      </div>
    </div>
    <div class="field">
      <span class="label">مصدر الأسئلة</span>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="src" id="s-past" value="past">التجميعات<small>أسئلة سابقة كما وردت</small></label>
        <label><input type="radio" name="src" id="s-new" value="new">جديدة<small>بنفس صياغة التجميعات</small></label>
        <label><input type="radio" name="src" id="s-both" value="both" checked>الاثنان<small>خليط من المصدرين</small></label>
      </div>
    </div>
    <div class="field">
      <span class="label">الفصول</span>
      <div class="chips" id="chapters"></div>
    </div>
    <div class="field">
      <span class="label">عدد الأسئلة</span>
      <div class="countrow">
        <div class="stepper">
          <button type="button" id="minus" aria-label="إنقاص">−</button>
          <input id="count" type="number" inputmode="numeric" min="1" value="20" class="num" aria-label="عدد الأسئلة">
          <button type="button" id="plus" aria-label="زيادة">+</button>
        </div>
        <input type="range" id="range" min="1" max="50" value="20" aria-label="عدد الأسئلة">
      </div>
      <div class="avail" id="avail"></div>
    </div>
    <div class="field">
      <div class="actions">
        <button class="btn" id="start">ابدأ الاختبار</button>
        <span class="hint" id="startHint"></span>
      </div>
    </div>
  </section>

  <!-- EXAM -->
  <section id="exam" hidden>
    <div class="panel q">
      <div class="bar"><span class="num" id="pos"></span><div class="track"><i id="prog"></i></div><span class="num" id="live"></span></div>
      <div class="tags" id="tags"></div>
      <div class="qtext" id="qtext"></div>
      <div id="body"></div>
      <div class="nav">
        <button class="btn ghost small" id="prev">السابق</button>
        <div class="actions">
          <button class="btn ghost small" id="quit">إنهاء وعرض النتيجة</button>
          <button class="btn small" id="next">التالي</button>
        </div>
      </div>
    </div>
    <div class="dots" id="dots" aria-label="الانتقال إلى سؤال"></div>
  </section>

  <!-- RESULTS -->
  <section id="results" hidden></section>

  <p class="foot">الأسئلة في حدود الملخص النهائي. أسئلة التجميعات مأخوذة من: الأسئلة الشاملة، وتجميعات الاختبار النهائي 1447هـ، والاختبار الدوري.</p>
</div>

<script>
// تجميعات: أسئلة شاملة (f1) — [الفصل, السؤال, الخيارات, رقم الإجابة الصحيحة]
const F1A = [
[1,'يقصد بالمنظمة الدولية أنها:',['تجمع شعبي عابر للحدود','هيئة دائمة تنشأ بإرادة الدول لتحقيق مصالح مشتركة','نظام قانوني داخلي','تحالف مؤقت بين دول'],1],
[1,'تتمتع المنظمة الدولية بشخصية مستقلة عن الدول الأعضاء بسبب:',['تعدد أجهزتها','استقلال إرادتها','مقرها الدائم','عدد أعضائها'],1],
[1,'أساس فكرة إنشاء المنظمات الدولية هو:',['التنافس الدولي','السيادة المطلقة','التعاون والتضامن','القوة العسكرية'],2],
[1,'الفرق الجوهري بين المنظمة الدولية والنظم الدولية أن النظم الدولية:',['كيانات مستقلة','تنشأ باتفاق دولي','مجموعة قواعد قانونية تنظم موضوعًا محددًا','تتمتع بإرادة ذاتية'],2],
[1,'مثال على النظم الدولية في القانون الدولي هو:',['منظمة الأمم المتحدة','نظام التمثيل الدبلوماسي والقنصلي','جامعة الدول العربية','منظمة الصحة العالمية'],1],
[1,'يختلف التنظيم الدولي عن المنظمة الدولية من حيث أن التنظيم الدولي:',['يتمتع بشخصية قانونية','يعبر عن الجانب العضوي والمادي للمجتمع الدولي','ينشأ باتفاق دولي','له إرادة مستقلة'],1],
[1,'يشترط لقيام المنظمة الدولية توافر عنصر:',['المؤقتية','الكيان الدائم','الخضوع لدولة معينة','الانفراد بالقرار'],1],
[1,'المقصود بالدوام في المنظمة الدولية هو:',['عدم قابليتها للحل','استمرار نشاطها دون توقف','وجود كيان دائم وليس مؤقتًا','انعقاد أجهزتها بشكل دائم'],2],
[1,'من عناصر المنظمة الدولية وجود:',['إرادة تابعة للدول','إرادة ذاتية مستقلة','تبعية قانونية كاملة','سلطة سيادية'],1],
[1,'يقصد بالإرادة الذاتية للمنظمة الدولية:',['خضوعها لإرادة الدولة الأقوى','قدرتها على إصدار توصيات فقط','تميز كيانها القانوني عن الدول الأعضاء','انعدام المسؤولية القانونية'],2],
[1,'من عناصر المنظمة الدولية أيضًا:',['الصفة المحلية','الصفة الدولية','الصفة الإقليمية فقط','الصفة المؤقتة'],1],
[1,'تعني الصفة الدولية للمنظمة أن:',['الأفراد هم من ينشئونها','تخضع للقانون الداخلي فقط','الدول هي الأصل في إنشائها وعضويتها','لا تتمتع بعضوية دول'],2],
[1,'تسمى المنظمات التي تنشئها الدول بـ:',['منظمات خاصة','منظمات غير حكومية','منظمات دولية حكومية','منظمات تطوعية'],2],
[1,'المنظمات الدولية غير الحكومية تنشأ بواسطة:',['الحكومات','المنظمات الدولية','الأفراد','مجلس الأمن'],2],
[1,'تخضع المنظمات غير الحكومية في الأصل إلى:',['القانون الدولي العام','ميثاق الأمم المتحدة','القانون الداخلي للدول','العرف الدولي'],2],
[1,'من نتائج تمتع المنظمة الدولية بالإرادة الذاتية أن:',['قراراتها لا تلزم الدول','قرارات الأغلبية تلزم جميع الأعضاء','تلزم فقط الدول الموافقة','تكون توصياتها دائمًا غير ملزمة'],1],
[1,'تنسب آثار الأعمال الصادرة عن المنظمة الدولية إلى:',['الدول الأعضاء منفردة','الدولة المقر','المنظمة الدولية ذاتها','الدولة صاحبة الاقتراح'],2],
[1,'من آثار الإرادة الذاتية للمنظمة تمتعها بـ:',['ذمة مالية تابعة للدول','ذمة مالية مستقلة','عدم الأهلية القانونية','إعفاء كامل من المسؤولية'],1],
[1,'من النتائج المترتبة على الشخصية المستقلة للمنظمة الدولية:',['عدم جواز التقاضي','أهلية التقاضي','التقاضي باسم الدول','التقاضي الداخلي فقط'],1],
[1,'يترتب على تمتع المنظمة بالإرادة الذاتية أيضًا:',['عدم إبرام المعاهدات','إبرام المعاهدات باسم الدول','إبرام المعاهدات والعقود باسمها ولحسابها','الاكتفاء بالتوصيات'],2],
[1,'من نتائج الإرادة الذاتية للمنظمة الدولية:',['عدم تمتعها بأي حصانات','تمتعها بالامتيازات الدبلوماسية','خضوعها المطلق لقانون الدولة','فقدان الصفة الدولية'],1],
[1,'إذا صدر قرار بالأغلبية داخل المنظمة الدولية فإنه:',['لا يلزم إلا الموافقين','يلزم الدولة صاحبة الاقتراح','يلزم جميع الدول الأعضاء','يكون مجرد رأي'],2],
[1,'من أهداف المنظمات الدولية:',['حماية سيادة دولة واحدة','فرض نظام الأمن الجماعي','توسيع النفوذ العسكري','تحقيق الهيمنة الاقتصادية'],1],
[1,'يقوم مبدأ الأمن الجماعي على:',['القوة الفردية','التحالفات الثنائية','العمل المشترك للمحافظة على السلم والأمن الدوليين','الحلول العسكرية فقط'],2],
[1,'يتضمن مبدأ العمل الجماعي في الأمن الجماعي:',['تجاهل العدوان','تحديد الأعمال العدوانية والمعتدي','التدخل الفردي','الحياد المطلق'],1],
[1,'من شقّي مبدأ العمل الجماعي:',['العقوبات الاقتصادية فقط','تنظيم الإجراءات الجماعية لقمع العدوان','التسوية الودية فقط','الدفاع الفردي'],1],

[1,'ميّز بين المنظمة الدولية والنظم الدولية والتنظيم الدولي.','• المنظمة الدولية: هيئة دائمة بإرادة ذاتية مستقلة، كيان قائم بذاته له إرادته.\n• النظم الدولية: مجموعة القواعد التي تنظم موضوعًا معينًا؛ مثالها في القانون الداخلي نظام الزواج ونظام السلطة، وفي القانون الدولي نظام التمثيل الدبلوماسي والقنصلي، وقد يقصد بها العادات والتقاليد المستقرة.\n• التنظيم الدولي: الجانب العضوي (التكوين المادي) للمجتمع الدولي كله، بنظرة ديناميكية تشمل وضعه الحالي بما فيه من نقص واحتمالات تطوره.\nباختصار: النظام مجموعة قواعد، والتنظيم صورة المجتمع الدولي كله وهو يتطور، والمنظمة كيان له إرادته.'],
[1,'عدّد النتائج المترتبة على تمتع المنظمة الدولية بالإرادة الذاتية.','١. القرارات الصادرة بالأغلبية تلزم كافة الدول الأعضاء.\n٢. آثار أعمال المنظمة تنسب إليها لا إلى الدول الأعضاء.\n٣. ذمة مالية مستقلة، فتكون دائنة أو مدينة للأعضاء أو للغير.\n٤. أهلية التقاضي، فتكون طرفًا في دعوى دولية مدعية أو مدعى عليها.\n٥. أهلية إبرام المعاهدات والعقود الدولية باسمها ولحسابها.\n٦. التمتع بالضمانات والامتيازات الدبلوماسية.'],
[1,'تكلم عن المنظمات الدولية غير الحكومية من حيث: من ينشئها، والقانون الذي تخضع له، وعلاقتها بالأمم المتحدة، مع ذكر أمثلة.','• ينشئها الأفراد لا الحكومات؛ وكل منظمة لا تنشأ عن طريق الاتفاقات بين الحكومات تعد غير حكومية (قرار المجلس الاقتصادي والاجتماعي 7 فبراير 1950م).\n• تخضع للقانون الداخلي لدولة أو عدة دول، وتتعاون مع المنظمات الحكومية القائمة.\n• علاقتها بالأمم المتحدة: للمجلس الاقتصادي والاجتماعي إجراء ترتيبات للتشاور معها في المسائل الداخلة في اختصاصه، مع الهيئات الدولية، ومع الهيئات الأهلية إذا رأى ذلك ملائمًا بعد التشاور مع عضو الأمم المتحدة ذي الشأن.\n• سبب التعاون: دورها فعال، وأنشطتها تؤثر إيجابًا وسلبًا في أنشطة المنظمات الحكومية.\n• أمثلتها: الهلال الأحمر، الصليب الأحمر، العفو الدولية، أطباء بلا حدود، جمعيات حقوق الإنسان.'],
[1,'اشرح هدف فرض نظام للأمن الجماعي، مع بيان شقّي مبدأ العمل الجماعي وموقف ميثاق الأمم المتحدة.','• سببه: الحروب الحديثة تختلف في وسائلها وآثارها عن التقليدية.\n• جوهره: مبدأ العمل المشترك للمحافظة على السلم والأمن الدوليين.\n• أسسه: الأخذ بالحلول السلمية، تحريم اللجوء إلى القوة، فرض جزاءات، إحلال التضامن الدولي محل السيادة المطلقة.\n• شقا العمل الجماعي: (١) وضع الشروط والإجراءات لتحديد الأعمال العدوانية والمعتدي. (٢) تنظيم إجراءات جماعية فعالة لقمع العدوان بإحدى صورتين: التحضير الجماعي (وقائي قبل العدوان)، والتدخل الجماعي (علاجي بعد وقوعه مع عقاب المعتدي).\n• موقف الميثاق: أخذ بنظرية الأمن الجماعي، وترك لمجلس الأمن سلطة تحديد العدوان، وأخذ بمبدأ العمل المشترك بشقيه.'],
[1,'تحدث عن تصنيف المنظمات الدولية من حيث النطاق الجغرافي، مع التمثيل.','١. العالمية: شروط العضوية على أساس عالمي فتنضم أية دولة تتوافر فيها الشروط؛ مثل الأمم المتحدة والوكالات المتخصصة. ولا توجد منظمة عالمية مطلقة لأن العضوية إرادية، ولأن الوضع القانوني قد يمنع كالدول المحايدة.\n٢. الإقليمية: تقتصر على دول يجمعها الجوار الجغرافي وروابط خاصة؛ مثل جامعة الدول العربية، الاتحاد الأفريقي، منظمة الدول الأمريكية، مجلس أوروبا، مجلس التعاون الخليجي.\n٣. التوليفية: لا تقتصر على منطقة ولا تمتد عالميًا، تضم دولًا من مناطق مختلفة يجمعها أساس مشترك: اقتصادي (أوبك)، ديني (منظمة المؤتمر الإسلامي)، أيديولوجي (حلف شمال الأطلسي).'],
[1,'اذكر صور تمثيل الأفراد والجماعات في المنظمات المختلطة مع التمثيل.','١. عضوية مباشرة للأفراد أو الجماعات أو لأقاليم لا تتمتع بالحكم الذاتي؛ مثالها الاتحاد العالمي للبريد.\n٢. أن يضم وفد الدولة أفرادًا يمثلون فئة معينة؛ مثالها منظمة العمل الدولية بممثلي العمال وأصحاب العمل.\n٣. أن يتكون أحد أجهزة المنظمة من أفراد عاديين فقط؛ مثالها الجمعية العامة لمجلس أوروبا.'],
[1,'عدّد أسباب تعدد المنظمات الدولية.','١. عدم القناعة بانفراد الأمم المتحدة.\n٢. صعوبة احتواء العلاقات في منظمة واحدة.\n٣. تنسيق المواقف داخل الأمم المتحدة.\n٤. الأزمات الدولية.\n٥. اختلاف المجالات والأهداف.\n٦. نجاح المنظمات.'],
[2,'عدّد مصادر قانون المنظمات الدولية، مع التمثيل لكل نوع.','١. المصدر الرئيسي: الوثائق المنشئة للمنظمات الدولية.\n٢. المصادر المشتقة (تكميلية تنشأ من الحياة الذاتية للمنظمة): اللوائح، السلوك اللاحق، الأعمال القانونية الصادرة عن أجهزتها (المعاهدات، الاتفاقيات، العقود، القرارات الملزمة، التوصيات، الرغبات، الآراء).\n٣. المصادر غير المشتقة (لا دخل للمنظمة في تكوينها): القواعد العامة للقانون الدولي العام، أحكام القضاء الدولي وآراؤه الاستشارية، آراء الفقه الدولي.'],
[2,'بيّن الطبيعة القانونية المزدوجة للوثائق المنشئة للمنظمات الدولية.','• الصفة التعاقدية (من حيث الشكل): تعد معاهدات لأنها أعمال قانونية يتفاوض عليها، والدول بحسب الأصل أطرافها، وترتب آثارًا قانونية، ويمكن تسجيلها لدى سكرتارية الأمم المتحدة. لكنها معاهدات من نوع خاص (شارعة تسري على جميع الأطراف دون تمييز)، فلا يجوز التحفظ عليها ما لم تنص على غير ذلك، وتخضع لقواعد المعاهدات وفق اتفاقية فيينا 1969م.\n• الصفة الدستورية (من حيث المضمون): تنشئ كيانات جديدة، وتحدد هياكلها، وتبين اختصاصاتها وتوزيعها، وتحدد سلطاتها وحقوق الدول وواجباتها.\n• النتيجة: لأحكام الوثيقة قيمة تعلو على جميع تعهدات الدول الأطراف السابقة واللاحقة.'],
[2,'تكلم عن التحفظ على نصوص الوثائق المنشئة: تعريفه، وأثره، وحكمه، وعلة التشدد فيه.','• تعريفه: إعلان من الدولة الراغبة في الانضمام تبين فيه رغبتها في استبعاد أو تعديل الأثر القانوني لبعض نصوص المعاهدة عند تطبيقها عليها.\n• أثره: يفصل جزء من المعاهدة عن مجموعها، فيعدل أثره (بزيادة حقوق المتحفظة أو إنقاص التزاماتها) أو يستبعد كليًا.\n• وقته: وقت تعبير الدولة عن رضاها بالالتزام.\n• حكمه: الأصل عدم جواز التحفظ ما لم يرد نص بغير ذلك؛ وإذا سكتت الوثيقة فلم تجزه ولم تمنعه فيقتضي موافقة الجهاز المختص في المنظمة (اتفاقية فيينا 1969م).\n• علة التشدد: التحفظ يجعل الحقوق والالتزامات تختلف من دولة لأخرى فيخل بمبدأ المساواة بين الدول.'],
[2,'اشرح إجراءات تعديل الوثائق المنشئة للمنظمات الدولية.','• سبب الحاجة: الوثائق من وضع البشر يشوبها النقص، وظروف المجتمع الدولي متغيرة.\n• المرحلة الأولى: اقتراح التعديل وإقراره من الجهاز المختص وفق ضوابط تختلف: الإجماع، أو أغلبية خاصة، أو موافقة دول بعينها، أو التفرقة بين أنواع التعديلات، أو الجمع بين الإجماع والأغلبية. وإذا صدر بالأغلبية سرى على الجميع، وبعض الوثائق تقرر انسحاب الدولة الرافضة.\n• المرحلة الثانية: تصديق الدول الأعضاء وفق أوضاعها الدستورية.\n• إعادة النظر في الوثيقة ككل: بمؤتمر عام أو داخل الجهاز العام، بالشروط نفسها اللازمة لأي تعديل.'],
[2,'تكلم عن تسجيل الوثائق المنشئة: إجراءاته، وجزاء عدم التسجيل، وأهدافه.','• الوثائق المنشئة معاهدات دائمة تخضع لنظام التسجيل، وكذلك تعديلاتها.\n• الإجراءات: تودع نسخة لدى أمانة الأمم المتحدة لتنشرها على الدول الأعضاء، ويتولى الوديع التسجيل لأن المنظمة لم توجد بعد.\n• الجزاء: لا يجوز التمسك بالوثيقة غير المسجلة أمام أي فرع من فروع الأمم المتحدة (وليس بطلانها).\n• الأهداف: منع إبرام المعاهدات السرية، وحث الدول على الدبلوماسية المعلنة.'],
[2,'بيّن علاقة اللائحة الداخلية بالوثيقة المنشئة للمنظمة الدولية.','١. علاقة الخاص بالعام: اللائحة قواعد خاصة تصدر وفق الوثيقة ولا يجوز أن تخالفها، وعند التعارض الغلبة للوثيقة ويلزم تعديل اللائحة.\n٢. دور المفسر: قد تفسر اللائحة بعض نصوص الوثيقة، كبيان المقصود بالأغلبية المطلوبة.\n٣. دور المكمل: تتضمن تفصيلات لم تذكرها الوثيقة، ككيفية التصويت وإدارة الجلسات.\n٤. علاقة إحالة: قد يحيل كل منهما إلى الآخر.'],
[2,'عرّف السلوك اللاحق لأجهزة المنظمات الدولية، وبيّن دوره في حياة المنظمة.','• تعريفه: السلوك الذي تتبعه أجهزة المنظمة في إدارة شؤونها ومباشرة وظائفها ومواجهة ما يستجد، لتحقيق أهدافها.\n• دوره: (١) وضع اختصاصات المنظمة موضع التنفيذ. (٢) التوافق مع المستجدات. (٣) تقديم دلائل عملية على تفسير الوثيقة. (٤) تغيير بعض نصوص الوثيقة أو إيقاف تطبيقها إذا استقر. (٥) تكوين قواعد عرفية إذا وجد سلوك مطرد متواتر مع الاعتقاد بإلزاميته.'],
[3,'تكلم عن آلية اكتساب الدولة عضوية منظمة دولية (العضوية الأصلية والعضوية بالانضمام).','• العضوية الأصلية: تثبت للدول المستقلة التي وقعت الوثيقة عند إبرامها ثم صدقت عليها وفق قواعدها الدستورية، وتعد مؤسِّسة.\n• العضوية بالانضمام: تثبت للدول التي قبلت بعد نشأة المنظمة ونفاذ وثيقتها؛ ولا تجوز إلا بنص صريح (المعاهدة المفتوحة تبيحه والمقفلة لا تبيحه). أثرها: يتمتع المنضم بجميع حقوق والتزامات الأعضاء الأصليين.\n• شروط الانضمام: جغرافية، دستورية، سياسية، اقتصادية، أيديولوجية، دينية.\n• إجراءاته تختلف: من حيث الحاجة للتصويت (العضوية الآلية دون تصويت إن توافرت الشروط)، والجهاز المختص (التنفيذي وحده أو مع العام)، وطريقة التصويت (الإجماع أو أغلبية خاصة).'],
[3,'اذكر أسباب فقد الدولة عضويتها في المنظمة الدولية، واشرح فقدان الاستقلال.','• الأسباب ثلاثة: فقدان الاستقلال، الانسحاب، الفصل.\n• فقدان الاستقلال: لا يسمح بالانضمام أو الاستمرار إلا للدول المستقلة ذات السيادة؛ لأن السيادة ركن للدولة، والدول المستقلة وحدها لها أهلية مباشرة العلاقات الدولية وتحمل الالتزامات.\n• حالاته: الاحتلال، الضم إلى دولة أخرى طوعًا أو كرهًا، الدخول في اتحاد دولي.\n• ممارسة الأمم المتحدة: أخذت بتفسير واسع، فقبلت دولًا ناقصة السيادة: سوريا ولبنان (انتداب فرنسي)، والهند (استعمار إنجليزي).'],
[3,'تكلم عن الانسحاب الإرادي من المنظمة الدولية: حكمه، ودوافعه، وتنظيمه، وفوائد تعيين مدة لسريانه.','• حكمه: حق مكفول لكل دولة ولا يستلزم نصًا، إعمالًا لمبدأ حرية الدولة.\n• دوافعه: عدم اتفاق العضوية مع ظروف الدولة، عدم وفاء المنظمة بالتزاماتها، تحقيق مصلحة حيوية، تعرض الدولة لخطر جسيم.\n• تنظيمه: بسيط (آلي بمجرد الإعلان)، أو مقيد (إعلان الرغبة قبل مدة، والوفاء بالالتزامات) حفاظًا على كيان المنظمة؛ وتظل الدولة ملتزمة حتى انتهاء المدة.\n• استعادة العضوية بطلب انضمام جديد.\n• فوائد المدة: فرصة للدولة للعدول، فرصة للمنظمة لإقناعها، تمكين المنظمة من تعديل ميزانيتها.'],
[3,'تكلم عن عقوبة الفصل من المنظمة الدولية: ضماناتها، والفصل الآلي، ونقدها، وبديلها.','• الفصل أشد العقوبات؛ تحرم الدولة من حقوقها وتتحلل من التزاماتها.\n• ضماناته: إمعان الدولة في الإخلال بواجباتها، أو أن يعرض بقاؤها المنظمة لخطر جسيم، وأن يصدر القرار من الجهاز العام بالإجماع دون احتساب صوت الدولة المعنية أو بأغلبية خاصة.\n• الفصل الآلي: تبعًا لاستبعاد الدولة من الأمم المتحدة في المنظمات التي تشترط عضويتها.\n• نقده: غير مجدٍ؛ يعفي الدولة من التزاماتها فتضعف المنظمة ماديًا وأدبيًا.\n• البديل: الإيقاف (فقد التصويت، والاشتراك في اللجان، والمعونة الفنية، وجميع المزايا) مع بقاء العضوية، ثم الفصل عند الإمعان؛ وبعض الوثائق اكتفت بالإيقاف.'],
[4,'اشرح قاعدة الصوت الواحد لكل دولة، والاستثناء عليها مع الأمثلة.','• القاعدة: لكل دولة صوت واحد أيًا كان عدد مندوبيها ومستشاريها؛ وهي الأصل في غالبية الأجهزة العامة، ونتيجتها تساوي الأصوات قوة نتيجة المساواة القانونية.\n• حرية الدولة في صوتها: الموافقة، الرفض، الامتناع، التغيب.\n• الاستثناء: التصويت الموزون في المنظمات الفنية؛ أسبابه: تفاوت القوة، اختلاف المصالح، تنوع المندوبين، تشجيع زيادة الحصة.\n• أمثلته: منظمة العمل الدولية (4 مندوبين: 2 حكومة + 1 أصحاب أعمال + 1 عمال، لكل منهم صوت مستقل)، صندوق النقد الدولي (250 صوتًا + صوت عن كل 100 ألف دولار)، البنك الدولي (250 صوتًا + صوت عن كل سهم).'],
[4,'تكلم عن قاعدة الإجماع: تعريفها، والمبدآن اللذان تقوم عليهما، وصورها، ومجال تطبيقها.','• تعريفها: موافقة جميع الدول الأعضاء في الجهاز على قراراته.\n• المبدآن: (١) المثالي المنطقي: المساواة بين الدول كاملة السيادة. (٢) الواقعي: إجماع الدول الكبرى شرط لا بد منه لتحملها عبء العمل والتنفيذ.\n• صورها: إجماع كل الأعضاء، أو إجماع الحاضرين فعلًا، أو إجماع المشتركين في التصويت (لا يدخل الممتنع والمتخلف).\n• مجالها: التنظيمات الإقليمية لقلة أعضائها (جامعة الدول العربية، الناتو، منظمة الدول الأمريكية...). أما العالمية فحلت محله الأغلبية لكثرة الأعضاء وصعوبة الاتفاق وتمكين دولة واحدة من فرض رأيها.'],
[4,'تكلم عن قاعدة الأغلبية: تعريفها، ومزاياها، وصورها.','• تعريفها: تصدر القرارات حين تنال أصوات غالبية الأعضاء، وتكون ملزمة للجميع حتى من لم يوافق.\n• مزاياها: (١) صعوبة اجتماع الدول على أمر واحد فتتجنب المنظمة تجميد نشاطها. (٢) لا تتعارض مع السيادة لأن الدولة قبلت الخضوع مقدمًا بإرادتها. (٣) ضمان العمل الديمقراطي والمرونة.\n• صورها: البسيطة (المطلقة، العادية) تتجاوز النصف بأي مقدار، والموصوفة (المشددة، الخاصة) تتجاوزه بمقدار معين.\n• أساس الحساب: أعضاء الجهاز أو الحاضرون أو المشتركون في التصويت. وقد تجمع الوثيقة بينهما: الموصوفة للمسائل الهامة، والبسيطة لغيرها.'],
[5,'اذكر الأجهزة الرئيسية المشتركة في المنظمات الدولية، وأسباب تعدد أجهزتها.','• الأجهزة الرئيسية: (١) الجهاز العام: تمثل فيه جميع الدول وهو بمثابة الجهاز النيابي التشريعي. (٢) الجهاز التنفيذي: يأخذ بفكرة التمثيل الضيق لاتخاذ قرارات سريعة. (٣) الجهاز الإداري: يتولى تسيير الحياة اليومية.\n• أسباب التعدد: (١) تعدد الاختصاصات بما يقتضي التخصص وتقسيم العمل. (٢) التوفيق بين طموحات الدول العظمى ومبدأ المساواة. (٣) زيادة عدد الأعضاء والحاجة لجهاز محدود التمثيل.'],
[5,'تكلم عن اختصاصات الجهاز العام للمنظمة الدولية، مع بيان الاختصاصات التي لا يجوز تفويضها.','١. حق التصدي لأية مسألة تدخل في اختصاص المنظمة ولو كانت من اختصاص جهاز آخر، ما لم يوجد نص بغير ذلك.\n٢. الإشراف على سائر الأجهزة، إذ تلزمها الوثيقة بتقديم تقارير دورية إليه.\n٣. تفويض بعض اختصاصاته ضمانًا للسرعة، عدا الاختصاصات الهامة: وضع السياسة العامة، انتخاب أعضاء المجلس التنفيذي، تعيين الأمين العام، اختيار قضاة المحكمة، تعديل الوثيقة المنشئة، التصديق على الاتفاقيات الدولية.'],
[5,'قارن بين الأجهزة الرئيسية الثلاثة من حيث الوظيفة والتشكيل وطريقة العمل والاختصاصات.','• الوظيفة: العام يرسم السياسة العامة ويشرف، التنفيذي ينفذها، الإداري يسير الحياة اليومية.\n• التشكيل: العام جميع الدول، التنفيذي عدد محدود من الدول (دائمون وغير دائمين أو مؤقتون فقط)، الإداري أمين عام ومساعدون وموظفون دوليون.\n• طريقة العمل: العام دورات عادية وغير عادية، التنفيذي على الدوام، الإداري إدارات وأقسام وهمزة وصل بين الجلسات.\n• الاختصاصات: العام واسعة ويتصدى لأي مسألة، التنفيذي محددة على سبيل الحصر، الإداري تحددها الوثيقة وأصبحت سياسية أيضًا.'],
[5,'تكلم عن الجهاز الإداري للمنظمة الدولية: تسمياته، وتشكيله، واختصاصاته.','• تسمياته: الأمانة العامة، السكرتارية العامة، الإدارة العامة.\n• تشكيله: رئيس (أمين عام أو سكرتير عام أو مدير عام) يختار لمدة محددة قابلة للتجديد بواسطة الجهاز العام أو التنفيذي أو كليهما؛ ومعاونون؛ وموظفون دوليون يعينهم الأمين العام وفق اللوائح.\n• أهميته: همزة الوصل بين جلسات الأجهزة الأخرى التي لا تنعقد باستمرار.\n• اختصاصاته: حلقة الوصل بين الأجهزة وبين المنظمة والهيئات الأخرى، إعداد أدوار الانعقاد وجداول الأعمال، إعداد مشروع الميزانية، متابعة تنفيذ القرارات، مشاركة رئيسه في المناقشات وإبداء الرأي.\n• التقارير: سنوية للجهازين العام والتنفيذي، وخاصة عند الطلب.'],
[5,'قضية: عُرضت على الجهاز العام لمنظمة دولية مسألة تدخل في اختصاص الجهاز التنفيذي، ولا يوجد نص يمنعه من نظرها. فما الحكم؟ مع التعليل.','الحكم: يحق للجهاز العام التصدي لها واتخاذ القرار المناسب.\nالتعليل: الجهاز العام يملك حق التصدي لأية مسألة تدخل في اختصاص المنظمة، سواء كانت من اختصاصه الأصيل أو من اختصاص أي جهاز آخر، ما لم يوجد نص يقضي بغير ذلك.'],
];

</script>
<script>
(function(){
const CH = {1:'الأول: التعريف بالمنظمات',2:'الثاني: مصادر القانون',3:'الثالث: العضوية',4:'الرابع: التصويت',5:'الخامس: هيكل المنظمة'};
const CHS = {1:'الفصل الأول',2:'الفصل الثاني',3:'الفصل الثالث',4:'الفصل الرابع',5:'الفصل الخامس'};
const AR = n => String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const LET = ['أ','ب','ج','د','هـ'];

// ---- build bank ----
const bank = [];
const addMcq = (arr, src, srcName) => arr.forEach(r => bank.push({type:'mcq', src, srcName, ch:r[0], q:r[1], opts:r[2], ans:r[3], exp:r[4]||''}));
addMcq(F1A,'past','تجميعات: الأسئلة الشاملة');
addMcq(F1B,'past','تجميعات: الأسئلة الشاملة');
addMcq(F4,'past','تجميعات النهائي 1447هـ');
addMcq(F2,'past','تجميعات: الاختبار الدوري');
addMcq(NEW_MCQ,'new','سؤال جديد');
ESSAY_PAST.forEach(r => bank.push({type:'essay', src:'past', srcName:'تجميعات: الاختبار الدوري', ch:r[0], q:r[1], model:r[2]}));
ESSAY_NEW.forEach(r => bank.push({type:'essay', src:'new', srcName:'سؤال جديد', ch:r[0], q:r[1], model:r[2]}));

// ---- setup ----
const $ = id => document.getElementById(id);
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };

const chBox = $('chapters');
Object.entries(CH).forEach(([k,v]) => {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" id="ch-${k}" value="${k}" checked>${v}`;
  chBox.appendChild(l);
});

const st = (b,s) => `<div class="stat"><b class="num">${AR(b)}</b><span>${s}</span></div>`;
$('stats').innerHTML =
  st(bank.filter(x=>x.type==='mcq'&&x.src==='past').length,'اختياري من التجميعات') +
  st(bank.filter(x=>x.type==='mcq'&&x.src==='new').length,'اختياري جديد') +
  st(bank.filter(x=>x.type==='essay'&&x.src==='past').length,'مقالي من التجميعات') +
  st(bank.filter(x=>x.type==='essay'&&x.src==='new').length,'مقالي جديد');

const val = n => document.querySelector(`input[name=${n}]:checked`).value;
const chosenCh = () => [...chBox.querySelectorAll('input:checked')].map(i=>+i.value);
function pool(){
  const k = val('kind'), s = val('src'), chs = chosenCh();
  return bank.filter(x => chs.includes(x.ch) && (s==='both'||x.src===s) && (k==='mix'||x.type===k));
}
function refresh(){
  const p = pool(), max = p.length;
  const mc = p.filter(x=>x.type==='mcq').length, es = max-mc;
  $('range').max = Math.max(1,max);
  let c = Math.min(Math.max(1,+$('count').value||1), Math.max(1,max));
  $('count').value = c; $('range').value = c; $('count').max = max;
  $('avail').innerHTML = max ? `المتاح بهذه الاختيارات: <b class="num">${AR(max)}</b> سؤالًا (${AR(mc)} اختياري، ${AR(es)} مقالي).` : 'لا توجد أسئلة بهذه الاختيارات؛ غيّر المصدر أو الفصول.';
  $('start').disabled = !max;
  $('startHint').textContent = max ? '' : '';
  store.set('qb-settings',{kind:val('kind'),src:val('src'),chs:chosenCh(),count:c});
}
document.querySelectorAll('#setup input').forEach(i => i.addEventListener('change', refresh));
$('range').addEventListener('input', e => { $('count').value = e.target.value; refresh(); });
$('count').addEventListener('input', refresh);
$('minus').onclick = () => { $('count').value = (+$('count').value||1) - 1; refresh(); };
$('plus').onclick  = () => { $('count').value = (+$('count').value||0) + 1; refresh(); };

const saved = store.get('qb-settings');
if (saved) {
  const set = (n,v) => { const el = document.querySelector(`input[name=${n}][value="${v}"]`); if (el) el.checked = true; };
  set('kind',saved.kind); set('src',saved.src);
  if (Array.isArray(saved.chs) && saved.chs.length) chBox.querySelectorAll('input').forEach(i => i.checked = saved.chs.includes(+i.value));
  if (saved.count) $('count').value = saved.count;
}
refresh();

// ---- exam ----
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
let Q = [], cur = 0;

function pick(p, n){
  if (val('kind') !== 'mix') return shuffle(p).slice(0,n);
  // mix: about 75% MCQ, 25% essay, like the exam
  const mc = shuffle(p.filter(x=>x.type==='mcq')), es = shuffle(p.filter(x=>x.type==='essay'));
  let ne = Math.min(es.length, Math.max(1, Math.round(n*0.25)));
  let nm = Math.min(mc.length, n-ne); ne = Math.min(es.length, n-nm);
  return [...mc.slice(0,nm), ...es.slice(0,ne)];
}
function start(list){
  Q = list.map(x => {
    if (x.type !== 'mcq') return {...x, mark:null, text:'', shown:false};
    const order = shuffle(x.opts.map((_,i)=>i));
    return {...x, order, chosen:null};
  });
  cur = 0;
  $('setup').hidden = true; $('results').hidden = true; $('exam').hidden = false;
  render(); window.scrollTo({top:0});
}
$('start').onclick = () => start(pick(pool(), +$('count').value));

function status(q){
  if (q.type==='mcq') return q.chosen===null ? '' : (q.chosen===q.ans ? 'ok' : 'no');
  return q.shown ? 'es' : '';
}
function render(){
  const q = Q[cur];
  $('pos').textContent = `${AR(cur+1)} / ${AR(Q.length)}`;
  $('prog').style.width = ((cur+1)/Q.length*100)+'%';
  const done = Q.filter(x=>x.type==='mcq'&&x.chosen!==null), right = done.filter(x=>x.chosen===x.ans).length;
  $('live').textContent = done.length ? `صحيح ${AR(right)} من ${AR(done.length)}` : '';
  $('tags').innerHTML = `<span class="tag">${CHS[q.ch]}</span><span class="tag src">${q.srcName}</span><span class="tag kind">${q.type==='mcq'?'اختياري':'مقالي'}</span>`;
  $('qtext').innerHTML = `<span class="qno num">${AR(cur+1)}.</span>${esc(q.q)}`;
  const b = $('body'); b.innerHTML = '';
  if (q.type==='mcq'){
    const ul = document.createElement('div'); ul.className='opts';
    q.order.forEach((oi,pos) => {
      const btn = document.createElement('button'); btn.className='opt'; btn.type='button';
      btn.innerHTML = `<span class="k">${LET[pos]}</span><span>${esc(q.opts[oi])}</span>`;
      if (q.chosen!==null){
        btn.disabled = true;
        if (oi===q.ans) btn.classList.add('correct');
        else if (oi===q.chosen) btn.classList.add('wrong');
      }
      btn.onclick = () => { q.chosen = oi; render(); };
      ul.appendChild(btn);
    });
    b.appendChild(ul);
    if (q.chosen!==null){
      const w = document.createElement('div'); w.className='why';
      const ok = q.chosen===q.ans;
      w.innerHTML = `<b>${ok?'إجابة صحيحة.':'الإجابة الصحيحة: '+esc(q.opts[q.ans])}</b>${q.exp?'<br>'+esc(q.exp):''}`;
      b.appendChild(w);
    }
  } else {
    const ta = document.createElement('textarea'); ta.id='essay-'+cur; ta.placeholder='اكتب إجابتك هنا ثم قارنها بالإجابة النموذجية...'; ta.value=q.text;
    ta.oninput = () => q.text = ta.value;
    b.appendChild(ta);
    const act = document.createElement('div'); act.className='actions'; act.style.marginTop='12px';
    if (!q.shown){
      const s = document.createElement('button'); s.className='btn small'; s.textContent='إظهار الإجابة النموذجية';
      s.onclick = () => { q.shown = true; render(); };
      act.appendChild(s); b.appendChild(act);
    } else {
      const m = document.createElement('div'); m.className='model'; m.style.marginTop='12px';
      m.innerHTML = `<h3>الإجابة النموذجية</h3>${esc(q.model)}`;
      b.appendChild(m);
      const sf = document.createElement('div'); sf.className='self'; sf.style.marginTop='12px';
      sf.innerHTML = '<span>قيّم إجابتك:</span>';
      [['g','أصبت'],['m','جزئيًا'],['b','لم أصب']].forEach(([c,t]) => {
        const x = document.createElement('button'); x.type='button'; x.className=c; x.textContent=t; x.setAttribute('aria-pressed', q.mark===c);
        x.onclick = () => { q.mark = c; render(); };
        sf.appendChild(x);
      });
      b.appendChild(sf);
    }
  }
  $('prev').disabled = cur===0;
  $('next').textContent = cur===Q.length-1 ? 'عرض النتيجة' : 'التالي';
  const d = $('dots'); d.innerHTML='';
  Q.forEach((x,i) => { const e = document.createElement('button'); e.textContent = AR(i+1); e.className = [status(x), i===cur?'cur':''].join(' '); e.setAttribute('aria-label','السؤال '+(i+1)); e.onclick=()=>{cur=i;render();}; d.appendChild(e); });
}
$('prev').onclick = () => { if (cur>0){cur--;render();} };
$('next').onclick = () => { if (cur<Q.length-1){cur++;render();} else results(); };
$('quit').onclick = results;

function results(){
  const mc = Q.filter(x=>x.type==='mcq'), es = Q.filter(x=>x.type==='essay');
  const ans = mc.filter(x=>x.chosen!==null), right = mc.filter(x=>x.chosen===x.ans);
  const pct = mc.length ? Math.round(right.length/mc.length*100) : 0;
  const wrong = mc.filter(x=>x.chosen!==x.ans);
  const byCh = {};
  mc.forEach(x => { byCh[x.ch] = byCh[x.ch]||{t:0,r:0}; byCh[x.ch].t++; if (x.chosen===x.ans) byCh[x.ch].r++; });
  const em = {g:es.filter(x=>x.mark==='g').length, m:es.filter(x=>x.mark==='m').length, b:es.filter(x=>x.mark==='b').length};
  let h = `<div class="panel" style="display:flex;flex-direction:column;gap:18px">
    <h2 style="font-size:20px">النتيجة</h2>`;
  if (mc.length) h += `<div class="score"><div class="ring" style="--p:${pct}"><div class="num">${AR(pct)}٪</div></div>
      <div><p><b>${AR(right.length)}</b> إجابة صحيحة من <b>${AR(mc.length)}</b> سؤالًا اختياريًا.</p>
      <p class="hint">${ans.length<mc.length ? `لم تُجب عن ${AR(mc.length-ans.length)} سؤالًا، وتُحسب خطأ.` : 'أجبت عن جميع الأسئلة الاختيارية.'}</p></div></div>
      <div class="stats">${Object.keys(byCh).sort().map(k=>st(`${byCh[k].r}/${byCh[k].t}`,CHS[k])).join('')}</div>`;
  if (es.length) h += `<p style="margin:0">المقالي: ${AR(es.length)} سؤالًا — أصبت ${AR(em.g)}، جزئيًا ${AR(em.m)}، لم أصب ${AR(em.b)}${es.length-em.g-em.m-em.b ? `، دون تقييم ${AR(es.length-em.g-em.m-em.b)}` : ''}.</p>`;
  h += `<div class="actions">
      ${wrong.length||em.b||em.m ? '<button class="btn" id="retry">أعد الأسئلة التي أخطأت فيها</button>' : ''}
      <button class="btn ghost" id="again">اختبار جديد</button></div></div>`;
  if (wrong.length) h += `<div class="panel"><h2 style="font-size:17px;margin-bottom:12px">مراجعة الأخطاء</h2><div class="review">${
    wrong.map(x=>`<div class="rv"><div class="h">${esc(x.q)}</div>
      ${x.chosen!==null?`<div class="a b">إجابتك: ${esc(x.opts[x.chosen])}</div>`:'<div class="a b">لم تُجب</div>'}
      <div class="a g">الصحيح: ${esc(x.opts[x.ans])}</div>${x.exp?`<div class="hint">${esc(x.exp)}</div>`:''}</div>`).join('')}</div></div>`;
  const r = $('results'); r.innerHTML = h;
  $('exam').hidden = true; r.hidden = false; window.scrollTo({top:0});
  const rt = $('retry'); if (rt) rt.onclick = () => start(shuffle([...wrong, ...es.filter(x=>x.mark==='b'||x.mark==='m')]));
  $('again').onclick = () => { r.hidden = true; $('setup').hidden = false; refresh(); window.scrollTo({top:0}); };
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
})();
</script>

</body>
</html>
